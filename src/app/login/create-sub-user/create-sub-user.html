<div class="container-fluid" >
    <h3 class="text-center">
  {{ isEdit ? 'Edit Sub User' : 'Create Sub User' }}
</h3>
    <form *ngIf="addEditForm" [formGroup]="addEditForm" (ngSubmit)="onSubmit()">
<div class="form-floating mb-2 mt-2">
  <input type="text" class="form-control" formControlName="username"  placeholder="name@example.com">
  <label >User Name</label>
</div>
<div class="form-floating mb-2 mt-2">
  <input type="text" class="form-control" formControlName="password"  placeholder="name@example.com">
  <label >Password</label>
</div>
<select class="form-select"
        formControlName="permissions">
  <option value="" disabled selected>
    Select permission
  </option>
  <option value="Full">Full</option>
  <option value="View">View</option>
</select>

<button type="submit"
        class="btn btn-success w-100 mt-4 mb-4"
        [disabled]="addEditForm.invalid">
  {{ isEdit ? 'Update Sub User' : 'Create Sub User' }}
</button>
</form>
</div>

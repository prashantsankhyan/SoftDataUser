<!-- Login -->
<section class="bg-light py-3 py-md-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
        <div class="card border border-light-subtle rounded-3 shadow-sm">
          <div class="card-body p-3 p-md-4 p-xl-5">

            <h2 class="fw-normal text-center text-secondary mb-4">
              Admin Login
            </h2>

            <form [formGroup]="addEditForm" (ngSubmit)="onSubmit()">

              <!-- Phone Number -->
              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control"
                  id="phoneNumber"
                  formControlName="phoneNumber"
                  placeholder="Phone Number"
                  inputmode="numeric"
                />
                <label for="phoneNumber">Phone Number</label>

                <!-- Errors -->
                <div class="text-danger small mt-1"
                  *ngIf="f['phoneNumber'].touched || submit">

                  <div *ngIf="f['phoneNumber'].hasError('required')">
                    Phone number is required
                  </div>

                  <div *ngIf="f['phoneNumber'].hasError('pattern')">
                    Enter valid 10 digit phone number
                  </div>
                </div>
              </div>

              <!-- Password -->
              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  formControlName="password"
                  placeholder="Password"
                />
                <label for="password">Password</label>

                <!-- Errors -->
                <div class="text-danger small mt-1"
                  *ngIf="f['password'].touched || submit">

                  <div *ngIf="f['password'].hasError('required')">
                    Password is required
                  </div>

                  <div *ngIf="f['password'].hasError('minlength')">
                    Password must be at least 4 characters
                  </div>

                  <div *ngIf="f['password'].hasError('invalid')">
                    Invalid password
                  </div>
                </div>
              </div>

              <!-- Submit -->
              <div class="d-grid my-3">
                <button
                  class="btn btn-primary btn-lg"
                  type="submit"
                  [disabled]="addEditForm.invalid || isLoading"
                >
                  {{ isLoading ? 'Please wait...' : 'Log in' }}
                </button>
              </div>

              <!-- Sub User -->
              <p class="m-0 text-secondary text-center">
                Want Contact with Sub User ?
                <a
                  routerLink="/subLogin"
                  class="link-primary text-decoration-none"
                  style="cursor:pointer"
                >
                  Sub User Login
                </a>
              </p>

            </form>
          </div>
        </div>

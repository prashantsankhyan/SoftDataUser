<div class="confirm-dialog">

  <div class="dialog-icon">
    <mat-icon>sync_alt</mat-icon>
  </div>

  <h2>Change Include / Exclude?</h2>

  <p>
    Are you sure you want to work on
    <strong>
      {{ data.value ? 'Exclude' : 'Include' }}
    </strong>?
  </p>

  <div class="dialog-actions">

    <button
      mat-stroked-button
      type="button"
      (click)="cancel()">
      Cancel
    </button>

    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="confirm()">
      Yes, Change
    </button>

  </div>

</div>

<div class="container-fluid">
  <mat-dialog-content>
    <form [formGroup]="addEditForm"  appEnterAsTab>

      <!--Unit Name-->
      <div class="mb-2">
        <label>Agent Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="agentName"
 (keydown)="handleTitleCase($event, 'agentName')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('agentName')?.invalid && (addEditForm.get('agentName')?.touched || submit)">
    Agent Name is required
  </div>
 
      </div>

      <!--Quantity -->
      <div >
        <label>Address</label>
        <textarea type="text"
          class="form-control"
          formControlName="address"
 (keydown)="handleTitleCase($event, 'address')"></textarea>
       
         <div class="text-danger mt-1" *ngIf="addEditForm.get('address')?.invalid && (addEditForm.get('address')?.touched || submit)">
   address is required
  </div>
      </div>

      <!-- //decimal// -->

        <div >
        <label>City</label>
        <input
          type="text"
          class="form-control"
          formControlName="city"
 (keydown)="handleTitleCase($event, 'city')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('city')?.invalid && (addEditForm.get('city')?.touched || submit)">
    city Name is required
  </div>
 
      </div>

       <div >
        <label>Pin Code</label>
        <input
          type="text"
          class="form-control"
          formControlName="pinCode"
 (keydown)="handleTitleCase($event, 'pinCode')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('pinCode')?.invalid && (addEditForm.get('pinCode')?.touched || submit)">
    pinCode is required
  </div>
 
      </div>


      
       <div >
        <label>Phone Number</label>
        <input
          type="text"
          class="form-control"
          formControlName="phoneNumber"
 (keydown)="handleTitleCase($event, 'phoneNumber')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('phoneNumber')?.invalid && (addEditForm.get('phoneNumber')?.touched || submit)">
    phoneNumber is required
  </div>
 
      </div>

          <div >
        <label>Pan No</label>
        <input
          type="text"
          class="form-control"
          formControlName="panNo"
 (keydown)="handleTitleCase($event, 'panNo')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('panNo')?.invalid && (addEditForm.get('panNo')?.touched || submit)">
    panNo is required
  </div>
 
      </div>


           <div >
        <label>Description</label>
        <input
          type="text"
          class="form-control"
          formControlName="description"
 (keydown)="handleTitleCase($event, 'description')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('description')?.invalid && (addEditForm.get('description')?.touched || submit)">
    description is required
  </div>
 
      </div>

     

    </form>
  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions class="mat-mdc-dialog-actions-align-end">
   <button
  type="submit"
  class="btn btn-sm btn-primary me-2"
 
  (click)="onSubmit()"
  style="cursor: pointer;">
  <i class="fas fa-check fa-sm text-white-50"></i>
  {{ isEditMode ? 'Update Agent Master' : 'Add Agent Master' }}
</button>

    <button
      type="button"
      mat-dialog-close
      class="btn btn-sm btn-danger">
      <i class="fas fa-times fa-sm text-white-50"></i> Cancel
    </button>
  </mat-dialog-actions>
</div>

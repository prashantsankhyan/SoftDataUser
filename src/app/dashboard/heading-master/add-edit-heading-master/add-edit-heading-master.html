<div class="container-fluid">
  <mat-dialog-content>
    <form [formGroup]="addEditForm"  appEnterAsTab>

      <!--Categiry Name-->
      <div class="mb-2">
        <label>Heading Name</label>
        <input
          type="text"
          class="form-control mt-2"
          formControlName="headingName"
 (keydown)="handleTitleCase($event, 'headingName')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('headingName')?.invalid && (addEditForm.get('headingName')?.touched || submit)">
    Heading Name is required
  </div>
 
      </div>

      <!--Categiry Type -->
   
    
    </form>
  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions class="mat-mdc-dialog-actions-align-end">
   <button
  type="submit"
  class="btn btn-sm btn-primary me-2"
 
  (click)="onSubmit()"
  style="cursor: pointer;">
  <i class="fas fa-check fa-sm text-white-50"></i>
  {{ isEditMode ? 'Update Heading Master' : 'Add Heading Master' }}
</button>

    <button
      type="button"
      mat-dialog-close
      class="btn btn-sm btn-danger">
      <i class="fas fa-times fa-sm text-white-50"></i> Cancel
    </button>
  </mat-dialog-actions>
</div>

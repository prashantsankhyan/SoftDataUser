
<div class="container-fluid">
  <div class="row mt-2">
    <div class="col-sm-6">
<div class="mb-2">
  <input
    type="text"
    class="form-control"
    placeholder="Search group name..."
    [(ngModel)]="searchText"
    (input)="applyFilter()"
  />
</div>
    </div>
      <div class="col-sm-6" style="text-align: right;">
<button type="button" class="btn btn-primary btn-m btn-block"(click)="addEditData($event)">Add Group Master</button>
    </div>
    
  </div>

<div class="mb-3">
  <button
    *ngFor="let letter of alphabets"
    class="btn btn-sm btn-outline-primary me-1 mb-1"
    (click)="filterByAlphabet(letter)"
  >
    {{ letter }}
  </button>

  <button
    class="btn btn-sm btn-outline-secondary ms-2"
    (click)="resetFilter()"
  >
    All
  </button>
</div>


<div class="table-scroll">
      <table class="table table-bordered table-hover">
  <thead class="table-light">
    <tr>
      <th>#</th>
      <th>Group Name</th>
      <th>Category</th>
      <th>Appear In</th>
      <th> </th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let item of listOfData; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ item.groupName }}</td>
      <td>{{ item.groupCategoryName }}</td>
      <td>{{ item.appearInName }}</td>
      <td style="text-align: center;">
           <button  *ngIf="item.companyId && item.companyId !== 0"
      class="btn btn-sm btn-primary me-1"
      (click)="addEditData(item)">
      <i class="fas fa-edit"></i> 
    </button>
      </td>
    
    </tr>

    <tr *ngIf="listOfData.length === 0">
      <td colspan="4" class="text-center text-muted">
        No data found
      </td>
    </tr>
  </tbody>
</table>
</div>



</div>

<div class="container-fluid">
  <mat-dialog-content>
    <form [formGroup]="addEditForm" >

      <!--Categiry Name-->
      <div class="mb-2">
        <label>class Name</label>
        <input
          type="text"
          class="form-control mt-2"
          formControlName="className"
 (keydown)="handleTitleCase($event, 'className')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('className')?.invalid && (addEditForm.get('className')?.touched || submit)">
    className Name is required
  </div>
 
      </div>

      <!--Categiry Type -->
      <div class="mb-2">
        <label>rate</label>
          <input
          type="text"
          class="form-control mt-2"
          formControlName="rate"
 (keydown)="handleTitleCase($event, 'rate')"
        />
      
       
         <div class="text-danger mt-1" *ngIf="addEditForm.get('rate')?.invalid && (addEditForm.get('rate')?.touched || submit)">
   rate is required
  </div>
      </div>


       <!--Categiry Type -->
      <div class="mb-2">
        <label>heading Name</label>
          <mat-form-field appearance="outline" class="w-100 city-field" >
  <mat-select
    #headingName
    formControlName="headingName"
    (selectionChange)="focusNext(headingName)">

    <mat-option *ngFor="let data of listOfHeading" [value]="data.id">
      {{ data.headingName }}
    </mat-option>

  </mat-select>
</mat-form-field>
        

          <!-- <select class="form-control" formControlName="headingName">
          <option value="" disabled>Select Category</option>
          <option *ngFor="let data of listOfHeading" [value]="data.id">
            {{ data.headingName }}
          </option>
        </select> -->
      
       
         <div class="text-danger mt-1" *ngIf="addEditForm.get('headingName')?.invalid && (addEditForm.get('headingName')?.touched || submit)">
   headingName is required
  </div>
      </div>

         <!--Categiry Type -->
      <div class="mb-2">
        <label>Type</label>
          <input
          type="text"
          class="form-control mt-2"
          formControlName="type"
 (keydown)="handleTitleCase($event, 'type')"
        />
      
       
         <div class="text-danger mt-1" *ngIf="addEditForm.get('type')?.invalid && (addEditForm.get('type')?.touched || submit)">
   type is required
  </div>
      </div>

    
    </form>
  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions class="mat-mdc-dialog-actions-align-end">
   <button
  type="submit"
  class="btn btn-sm btn-primary me-2"
 
  (click)="onSubmit()"
  style="cursor: pointer;">
  <i class="fas fa-check fa-sm text-white-50"></i>
  {{ isEditMode ? 'Update GST VAT Master' : 'Add GST VAT Master' }}
</button>

    <button
      type="button"
      mat-dialog-close
      class="btn btn-sm btn-danger">
      <i class="fas fa-times fa-sm text-white-50"></i> EXIT
    </button>
  </mat-dialog-actions>
</div>

<div class="container-fluid">
  <mat-dialog-content>
    <form [formGroup]="addEditForm" >

  <div class="row g-3">

   
   

    <div class="mb-2">
      <label class="form-label">Narration</label>
      <input type="text" class="form-control" formControlName="narration" (keydown)="handleTitleCase($event, 'narration')">
       <div class="text-danger mt-1" *ngIf="addEditForm.get('narration')?.invalid && (addEditForm.get('narration')?.touched || submit)">
     Name is required
  </div>
    </div>

   
  

  </div>

</form>

  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions class="mat-mdc-dialog-actions-align-end">
   <button
  type="submit"
  class="btn btn-sm btn-primary me-2"
 
  (click)="onSubmit()"
  style="cursor: pointer;">
  <i class="fas fa-check fa-sm text-white-50"></i>
  {{ isEditMode ? 'Update Narration  Master' : 'Add Narration Master' }}
</button>

    <button
      type="button"
      mat-dialog-close
      class="btn btn-sm btn-danger">
      <i class="fas fa-times fa-sm text-white-50"></i> Cancel
    </button>
  </mat-dialog-actions>
</div>

<h2 mat-dialog-title>Delete Sub User</h2>

    <mat-dialog-content>
      Are you sure you want to delete this Sub User?
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-stroked-button (click)="onNoClick()">Cancel</button>
      <button mat-raised-button color="warn" (click)="deleteRecord()">
        Delete
      </button>
    </mat-dialog-actions>

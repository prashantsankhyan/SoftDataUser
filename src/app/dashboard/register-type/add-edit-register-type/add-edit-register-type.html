<div class="container-fluid">
  <mat-dialog-content>
    <form [formGroup]="addEditForm"  appEnterAsTab>

      <!--Unit Name-->
      <div class="mb-2">
        <label>Registration Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="registerType"
 (keydown)="handleTitleCase($event, 'registerType')"
        />
      <div class="text-danger mt-1" *ngIf="addEditForm.get('registerType')?.invalid && (addEditForm.get('registerType')?.touched || submit)">
    register Type  is required
  </div>
 
      </div>

    


      
    


     

    </form>
  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions class="mat-mdc-dialog-actions-align-end">
   <button
  type="submit"
  class="btn btn-sm btn-primary me-2"
 
  (click)="onSubmit()"
  style="cursor: pointer;">
  <i class="fas fa-check fa-sm text-white-50"></i>
  {{ isEditMode ? 'Update Registration Master' : 'Add Registration Master' }}
</button>

    <button
      type="button"
      mat-dialog-close
      class="btn btn-sm btn-danger">
      <i class="fas fa-times fa-sm text-white-50"></i> Cancel
    </button>
  </mat-dialog-actions>
</div>

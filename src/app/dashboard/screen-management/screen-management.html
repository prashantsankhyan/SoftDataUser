<form [formGroup]="form" class="screen-form">

  <!-- SALE -->
  <mat-card class="section-card mt-2">
    <mat-card-title class="p-2">Sale</mat-card-title>

    <div class="checkbox-grid mt-2">
      <mat-checkbox formControlName="barcodeSale">Barcode Sale</mat-checkbox>
      <mat-checkbox formControlName="remarksSale">Remarks</mat-checkbox>
      <mat-checkbox formControlName="hsnSale">HSN</mat-checkbox>
      <mat-checkbox formControlName="artSale">Art</mat-checkbox>
      <mat-checkbox formControlName="sizeSale">Size</mat-checkbox>
      <mat-checkbox formControlName="colorSale">Color</mat-checkbox>
      <mat-checkbox formControlName="pack1Sale">Pack 1</mat-checkbox>
      <mat-checkbox formControlName="pack2Sale">Pack 2</mat-checkbox>
      <mat-checkbox formControlName="mRateSale">MRP</mat-checkbox>
        
      <mat-checkbox formControlName="discPercentSale">Discount % Sale</mat-checkbox>
      <mat-checkbox formControlName="discountSale">Discount Sale</mat-checkbox> <br/>
      <div class="row">
        <div class="col-sm-4">
  <label style="color: black;"> What we Do </label>
       <input class="form-control mt-2"  formControlName="whatWeDoInSale">
        </div>
        <div class="col-sm-4">
  <label style="color: black;"> Description</label>
       <input class="form-control mt-2"  formControlName="descriptionSale">

        </div>
         <div class="col-sm-4 mb-2">
   <label style="color: black;"> Terms and Conditions Sale</label>
      
      <textarea class="form-control mt-2" rows="4" formControlName="termAndConditionSale"></textarea>

        </div>

      </div>
     

      
    
    </div>
  </mat-card>

  <!-- PURCHASE -->
  <mat-card class="section-card mt-4">
    <mat-card-title class="p-2">Purchase</mat-card-title>

    <div class="checkbox-grid mt-2">
      <mat-checkbox formControlName="barcodePurchase">Barcode Purchase</mat-checkbox>
      <mat-checkbox formControlName="remarksPurchase">Remarks</mat-checkbox>
      <mat-checkbox formControlName="hsnPurchase">HSN</mat-checkbox>
      <mat-checkbox formControlName="artPurchase">Art</mat-checkbox>
      <mat-checkbox formControlName="sizePurchase">Size</mat-checkbox>
      <mat-checkbox formControlName="colorPurchase">Color</mat-checkbox>
      <mat-checkbox formControlName="pack1Purchase">Pack 1</mat-checkbox>
      <mat-checkbox formControlName="pack2Purchase">Pack 2</mat-checkbox>
      <mat-checkbox formControlName="mRatePurchase">MRP</mat-checkbox>
        
      <mat-checkbox formControlName="discPercentPurchase">Discount % Purchase</mat-checkbox>
      <mat-checkbox formControlName="discountPurchase">Discount Purchase</mat-checkbox>
      <br/>

      <label style="color: black;"> Terms and conditions Purchase</label>
      <textarea class="form-control mt-2" rows="5" formControlName="termAndConditionPurchase"></textarea>
    </div>
  </mat-card>

  <!-- EXTRA -->
  <mat-card class="section-card mt-4">
    <!-- <mat-card-title class="p-2">Extra</mat-card-title>

    <div class="checkbox-grid mt-2">
    

    
    </div> -->
  </mat-card>

  <!-- ACTIONS -->
  <div class="action-bar mt-2">
    <button
      mat-raised-button
      color="primary"
      (click)="save()"
     
    >
      Save
    </button>

  
  </div>

</form>
